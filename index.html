    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000;
        overflow: hidden; /* Prevent scrolling on enter screen */
        cursor: crosshair; /* Aesthetic crosshair cursor */
      }
      .font-mono {
        font-family: 'Space Mono', monospace;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f0f0f; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }
      
      /* Glitch Effect Keyframes */
      @keyframes glitch {
        0% { transform: translate(0) }
        20% { transform: translate(-2px, 2px) }
        40% { transform: translate(-2px, -2px) }
        60% { transform: translate(2px, 2px) }
        80% { transform: translate(2px, -2px) }
        100% { transform: translate(0) }
      }
      .glitch-hover:hover {
        animation: glitch 0.2s cubic-bezier(.25, .46, .45, .94) both infinite;
      }

      /* CRT Scanline Effect */
      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.1) 50%,
          rgba(0,0,0,0.1)
        );
        background-size: 100% 4px;
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: 40;
        pointer-events: none;
      }

      /* Blinking Cursor for Typewriter */
      .typing-cursor::after {
        content: '|';
        animation: blink 1s step-start infinite;
        vertical-align: text-bottom;
        margin-left: 2px;
        font-weight: 400;
        opacity: 0.8;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }

      /* Ken Burns Background Animation */
      @keyframes ken-burns {
        0% { transform: scale(1.05) translate(0, 0); }
        50% { transform: scale(1.15) translate(-1%, -1%); }
        100% { transform: scale(1.05) translate(0, 0); }
      }
      .animate-ken-burns {
        animation: ken-burns 20s ease-in-out infinite alternate;
      }
    </style>
